[project]
name = "ai-hub"
version = "1.0.0"
description = "AI Hub - Multi-Tool AI Platform powered by Puter API"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
]

[tool.setuptools]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
